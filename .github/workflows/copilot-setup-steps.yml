name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'

jobs:
  # CRITICAL: This job name MUST be exactly 'copilot-setup-steps'
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Spatial Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up Pandoc (required for Rmd/vignettes)
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
